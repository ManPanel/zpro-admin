<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Z Pro — Admin Panel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Saira:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#0B0C12; --side:#0F1018; --card:#14161F; --line:rgba(255,255,255,.08);
    --text:#FFFFFF; --muted:#C4C8D2; --quiet:#A9AEBB; --accent:#FF2A36;
    --ok:#2DB560; --warn:#F2C230;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;font-size:15px}
  h1,h2,h3{font-family:Saira,Inter,sans-serif;margin:0}
  a{color:#FF6B73}
  button,input,select,textarea{font-family:inherit;font-size:14px}
  input[type=text],input[type=url],input[type=email],input[type=password],input[type=number],input[type=search],select,textarea{
    height:42px;padding:0 12px;border-radius:9px;border:1px solid rgba(255,255,255,.16);background:var(--bg);color:#fff;width:100%}
  textarea{height:auto;padding:10px 12px;resize:vertical}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:1px}
  input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent)}
  .btn{height:42px;padding:0 16px;border-radius:9px;border:none;background:rgba(255,255,255,.1);color:#fff;font-weight:600;cursor:pointer;white-space:nowrap}
  .btn:hover{background:rgba(255,255,255,.16)}
  .btn.primary{background:var(--accent);font-weight:700}
  .btn.primary:hover{filter:brightness(1.1)}
  .btn.ghost{background:transparent;border:1px solid rgba(255,255,255,.18)}
  .btn.danger{background:rgba(229,51,63,.18);color:#FFB3B7}
  .btn.sm{height:34px;padding:0 10px;font-size:13px}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:var(--muted)}
  label.c{display:flex;align-items:center;gap:10px;font-size:15px;color:#E6E8EE}
  .hint{font-size:13px;color:var(--quiet);margin:0}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;display:flex;flex-direction:column;gap:16px}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:20px}
  .row{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
  .row > .grow{flex:1 1 220px}
  table{width:100%;border-collapse:collapse}
  th{text-align:left;color:var(--quiet);font-size:13px;font-weight:600;padding:10px 12px}
  td{padding:10px 12px;border-top:1px solid var(--line);vertical-align:middle}
  .tbl{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:16px}
  .pill{display:inline-block;padding:4px 8px;border-radius:6px;font-size:12px;font-weight:700}
  .pill.red{background:rgba(255,42,54,.2);color:#FFB3B7}
  .pill.grey{background:rgba(255,255,255,.08);color:var(--muted)}
  .pill.green{background:rgba(45,181,96,.18);color:#7FE0A3}

  /* layout */
  #app{display:none;min-height:100vh;flex-wrap:wrap}
  aside{flex:1 1 240px;max-width:270px;background:var(--side);border-right:1px solid var(--line);padding:24px 14px;display:flex;flex-direction:column;gap:20px}
  .brand{display:flex;align-items:center;gap:12px;padding:0 8px}
  .logo{width:40px;height:40px;border-radius:10px;background:radial-gradient(circle at 35% 30%,#FF5A63,#5A0A12 75%);display:flex;align-items:center;justify-content:center;font-family:Saira;font-weight:800;font-size:22px;box-shadow:0 0 18px rgba(255,42,54,.4)}
  nav{display:flex;flex-direction:column;gap:2px}
  nav button{all:unset;cursor:pointer;padding:11px 12px;border-radius:9px;color:var(--muted);font-size:15px;font-weight:500}
  nav button:hover{background:rgba(255,255,255,.05);color:#fff}
  nav button.on{background:rgba(255,42,54,.18);color:#fff;box-shadow:inset 3px 0 0 var(--accent)}
  nav button:focus-visible{outline:2px solid var(--accent)}
  .who{margin-top:auto;padding:12px;border-radius:10px;background:rgba(255,255,255,.04);font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:8px;word-break:break-all}
  main{flex:999 1 640px;min-width:0;padding:32px 40px 60px;display:flex;flex-direction:column;gap:24px}
  .head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px}
  .head p{margin:6px 0 0;color:var(--muted)}
  .head h1{font-size:30px;font-weight:700}

  /* login */
  #login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
  #login form{width:100%;max-width:420px}

  /* tiles */
  .tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:20px}
  .tile{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column}
  .tile .pv{height:150px;display:flex;align-items:flex-end;padding:16px;background-size:cover;background-position:center}
  .tile .pv span{font-family:Saira;font-weight:700;font-size:24px;text-shadow:0 2px 10px rgba(0,0,0,.6)}
  .tile .bd{padding:16px;display:flex;flex-direction:column;gap:12px}
  .thumb{display:inline-block;width:44px;height:44px;border-radius:50%;background:#222 center/cover;border:1px solid rgba(255,255,255,.2);flex:none}
  .img-prev{width:160px;height:90px;border-radius:8px;background:#000 center/cover;border:1px solid var(--line);flex:none}
  .img-prev.sq{width:90px;height:90px}
  .img-prev.tall{width:51px;height:90px}
  .stat{font-family:Saira;font-size:34px;font-weight:700}

  #toast{position:fixed;right:24px;bottom:24px;display:flex;flex-direction:column;gap:8px;z-index:10}
  .t{padding:12px 16px;border-radius:10px;background:#1E2130;border:1px solid var(--line);box-shadow:0 10px 30px rgba(0,0,0,.4);max-width:380px}
  .t.err{border-color:rgba(255,42,54,.6)}
  .t.ok{border-color:rgba(45,181,96,.6)}
  .hidden{display:none !important}
  /* mobile : menu latéral qui s'ouvre avec ☰ */
  #mbar{display:none}
  #scrim{display:none}
  @media (max-width: 860px){
    #app{display:none;flex-direction:column}
    #mbar{display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:20;padding:12px 16px;background:var(--side);border-bottom:1px solid var(--line)}
    #mbar button{all:unset;cursor:pointer;width:42px;height:42px;display:flex;align-items:center;justify-content:center;border-radius:10px;background:rgba(255,255,255,.06);font-size:22px}
    #mbar .logo{width:34px;height:34px;font-size:18px}
    aside{position:fixed;top:0;left:0;bottom:0;width:280px;max-width:84vw;z-index:40;transform:translateX(-105%);transition:transform .22s ease;overflow-y:auto;max-width:84vw}
    body.menu-open aside{transform:none;box-shadow:0 0 40px rgba(0,0,0,.6)}
    body.menu-open #scrim{display:block;position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.55)}
    main{padding:20px 16px 60px}
    .head h1{font-size:24px}
    .grid{grid-template-columns:1fr}
  }

</style>
</head>
<body>

<!-- ======================= LOGIN ======================= -->
<section id="login">
  <form class="card" id="loginForm">
    <div class="brand" style="padding:0">
      <div class="logo" aria-hidden="true">Z</div>
      <div><h1 style="font-size:22px">Z PRO</h1><span class="hint">Admin Panel</span></div>
    </div>
    <h2 style="font-size:24px">Connexion</h2>
    <label class="f">Email<input type="email" id="lgEmail" autocomplete="username" required></label>
    <label class="f">Mot de passe<input type="password" id="lgPass" autocomplete="current-password" required></label>
    <button class="btn primary" type="submit" id="lgBtn">Se connecter</button>
    <p class="hint" id="lgMsg" role="status"></p>
  </form>
</section>

<!-- ======================= APP ======================= -->
<div id="app">
  <div id="mbar">
    <button type="button" id="menuBtn" aria-label="Ouvrir le menu">☰</button>
    <div class="logo" aria-hidden="true">Z</div>
    <span style="font-family:Saira;font-weight:800;font-size:18px;letter-spacing:1px">Z PRO</span>
  </div>
  <div id="scrim"></div>
  <aside>
    <div class="brand">
      <div class="logo" aria-hidden="true">Z</div>
      <div style="display:flex;flex-direction:column">
        <span style="font-family:Saira;font-weight:800;font-size:20px;letter-spacing:1px">Z PRO</span>
        <span class="hint">Admin Panel</span>
      </div>
    </div>
    <nav id="nav" aria-label="Rubriques"></nav>
    <div class="who"><span id="whoEmail"></span><button class="btn sm ghost" id="logout" type="button">Se déconnecter</button></div>
  </aside>
  <main id="main" aria-live="polite"></main>
</div>

<div id="toast" aria-live="polite"></div>

<script>
/* ============================================================
   Z Pro — Admin Panel v1
   Données : Supabase (projet zpro). La clé publique est faite
   pour être dans une page web ; la sécurité vient des règles RLS.
   ============================================================ */
const SUPABASE_URL = 'https://fwwjhwszsegnbackjxad.supabase.co';
const SUPABASE_KEY = 'sb_publishable_wSP31nEjmDcVZDjzMRpr6g_Uum62B0a';
const BUCKET = 'images';

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = (s, el = document) => el.querySelector(s);
const esc = (v) => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

let CONFIG = null;
let ROLE = 'owner', VENDOR = null, ME_ID = null;

/* ---------- petites aides ---------- */
function toast(msg, type = 'ok') {
  const d = document.createElement('div');
  d.className = 't ' + type; d.textContent = msg;
  $('#toast').appendChild(d);
  setTimeout(() => d.remove(), type === 'err' ? 7000 : 3000);
}
function fail(e, what) {
  console.error(e);
  toast((what ? what + ' : ' : '') + (e?.message || e), 'err');
}
async function q(promise, what) {
  const { data, error } = await promise;
  if (error) { fail(error, what); error._shown = true; throw error; }
  return data;
}
function pickFile(accept = 'image/*') {
  return new Promise(res => {
    const i = document.createElement('input');
    i.type = 'file'; i.accept = accept;
    i.onchange = () => res(i.files[0] || null);
    i.click();
  });
}
async function uploadFile(file, folder) {
  const ext = (file.name.split('.').pop() || 'bin').toLowerCase();
  const path = `${folder}/${Date.now()}-${Math.random().toString(36).slice(2, 8)}.${ext}`;
  await q(sb.storage.from(BUCKET).upload(path, file, { upsert: true, contentType: file.type || undefined }), 'Envoi du fichier');
  return sb.storage.from(BUCKET).getPublicUrl(path).data.publicUrl;
}
async function loadConfig() {
  CONFIG = await q(sb.from('app_config').select('*').eq('id', 1).single(), 'Lecture de la configuration');
  return CONFIG;
}
async function saveConfig(patch, okMsg = 'Enregistré') {
  CONFIG = await q(sb.from('app_config').update(patch).eq('id', 1).select().single(), 'Enregistrement');
  toast(okMsg);
  return CONFIG;
}
function head(title, text, actions = '') {
  return `<div class="head"><div><h1>${esc(title)}</h1>${text ? `<p>${esc(text)}</p>` : ''}</div><div class="row">${actions}</div></div>`;
}
function bg(url, fallback) {
  return url ? `background-image:url('${esc(url)}')` : `background:${fallback}`;
}
/* lit les champs [data-k] d'un bloc et renvoie un objet */
function readFields(root) {
  const o = {};
  root.querySelectorAll('[data-k]').forEach(el => {
    const k = el.dataset.k;
    if (el.type === 'checkbox') o[k] = el.checked;
    else if (el.type === 'number') o[k] = el.value === '' ? null : Number(el.value);
    else o[k] = el.value.trim() === '' ? null : el.value.trim();
  });
  return o;
}

/* ---------- connexion ---------- */
$('#loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  $('#lgBtn').disabled = true; $('#lgMsg').textContent = 'Connexion…';
  const { error } = await sb.auth.signInWithPassword({ email: $('#lgEmail').value.trim(), password: $('#lgPass').value });
  $('#lgBtn').disabled = false;
  if (error) { $('#lgMsg').textContent = 'Email ou mot de passe incorrect.'; return; }
  $('#lgPass').value = '';
  boot();
});
$('#logout').addEventListener('click', async () => { await sb.auth.signOut(); location.reload(); });

async function boot() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { $('#login').classList.remove('hidden'); $('#app').style.display = 'none'; return; }
  const { data: me } = await sb.from('admins').select('user_id').eq('user_id', session.user.id).maybeSingle();
  ME_ID = session.user.id;
  if (me) ROLE = 'owner';
  else {
    const { data: v } = await sb.from('vendors').select('*').eq('user_id', session.user.id).maybeSingle();
    if (!v || !v.active) {
      $('#lgMsg').textContent = v ? 'Ce compte vendeur est désactivé.' : "Ce compte n'a pas accès au panel.";
      await sb.auth.signOut(); return;
    }
    ROLE = 'vendor'; VENDOR = v;
  }
  $('#whoEmail').textContent = session.user.email + (ROLE === 'vendor' ? ' (vendeur)' : '');
  $('#login').classList.add('hidden');
  $('#app').style.display = 'flex';
  if (ROLE === 'owner') { try { await loadConfig(); } catch { return; } }
  buildNav();
  go(location.hash.slice(1) || (ROLE === 'owner' ? 'dashboard' : 'subs'));
}

/* ---------- navigation ---------- */
const PAGES = [
  ['dashboard', 'Tableau de bord'], ['subs', 'Abonnements'], ['vendors', 'Vendeurs'], ['dns', 'Serveur & DNS'], ['brand', 'Marque & logo'],
  ['home', 'Accueil'], ['cats', 'Catégories'], ['vod', 'Films & Séries'], ['matchs', 'Matchs'],
  ['texts', 'Textes'], ['messages', 'Messages'], ['reports', 'Signalements'], ['devices', 'Appareils'],
  ['updates', 'Mises à jour'], ['maintenance', 'Maintenance']
];
function buildNav() {
  const list = ROLE === 'owner' ? PAGES : PAGES.filter(([id]) => id === 'subs');
  $('#nav').innerHTML = list.map(([id, name]) => `<button type="button" data-go="${id}">${esc(name)}</button>`).join('');
  $('#nav').onclick = (e) => { const b = e.target.closest('[data-go]'); if (b) { document.body.classList.remove('menu-open'); go(b.dataset.go); window.scrollTo(0, 0); } };
  $('#menuBtn').onclick = () => document.body.classList.toggle('menu-open');
  $('#scrim').onclick = () => document.body.classList.remove('menu-open');
}
async function go(id) {
  if (ROLE !== 'owner' && id !== 'subs') id = 'subs';
  if (!RENDER[id]) id = 'dashboard';
  if (location.hash.slice(1) !== id) history.replaceState(null, '', '#' + id);
  document.querySelectorAll('#nav button').forEach(b => b.classList.toggle('on', b.dataset.go === id));
  $('#main').innerHTML = '<p class="hint">Chargement…</p>';
  try { await RENDER[id]($('#main')); } catch (e) { if (!e?._shown) fail(e); }
}
const RENDER = {};

/* ================= Tableau de bord ================= */
RENDER.dashboard = async (m) => {
  const [dns, tiles, reports] = await Promise.all([
    q(sb.from('dns_servers').select('id,active,role')),
    q(sb.from('home_tiles').select('key,visible')),
    q(sb.from('reports').select('id', { count: 'exact' }).eq('resolved', false))
  ]);
  const c = CONFIG;
  m.innerHTML = head('Tableau de bord', "État de l'application Z Pro.") + `
  <div class="grid">
    <div class="card"><span class="hint">Serveurs DNS actifs</span><span class="stat">${dns.filter(d => d.active).length}</span></div>
    <div class="card"><span class="hint">Tuiles visibles sur l'accueil</span><span class="stat">${tiles.filter(t => t.visible).length} / ${tiles.length}</span></div>
    <div class="card"><span class="hint">Signalements à traiter</span><span class="stat">${reports.length}</span></div>
    <div class="card"><span class="hint">Version en ligne</span><span class="stat">${esc(c.latest_version)}</span>
      <span>${c.force_update ? '<span class="pill red">Mise à jour obligatoire</span>' : '<span class="pill grey">Mise à jour facultative</span>'}</span></div>
    <div class="card"><span class="hint">Maintenance</span>
      <span>${c.maintenance_enabled ? '<span class="pill red">Activée : les clients voient l\'écran de maintenance</span>' : '<span class="pill green">Désactivée</span>'}</span></div>
    <div class="card"><span class="hint">Dernière modification</span><span>${new Date(c.updated_at).toLocaleString('fr-FR')}</span></div>
  </div>`;
};

/* ================= Serveur & DNS ================= */
RENDER.dns = async (m) => {
  const rows = await q(sb.from('dns_servers').select('*').order('position'));
  m.innerHTML = head('Serveur & DNS', "Le client ne voit jamais ces adresses. Si le principal ne répond pas, l'app passe au secours.") + `
  <div class="tbl"><table>
    <thead><tr><th>Adresse</th><th>Rôle</th><th>Actif</th><th>Actions</th></tr></thead>
    <tbody>${rows.map(r => `
      <tr data-id="${r.id}">
        <td style="min-width:280px"><input type="url" value="${esc(r.url)}" data-f="url" aria-label="Adresse du DNS"></td>
        <td><select data-f="role" aria-label="Rôle"><option value="primary" ${r.role === 'primary' ? 'selected' : ''}>Principal</option><option value="backup" ${r.role === 'backup' ? 'selected' : ''}>Secours</option></select></td>
        <td><input type="checkbox" data-f="active" aria-label="Actif" ${r.active ? 'checked' : ''}></td>
        <td><div class="row"><button class="btn sm" data-a="test">Tester</button><button class="btn sm danger" data-a="del">Supprimer</button></div></td>
      </tr>`).join('') || '<tr><td colspan="4" class="hint">Aucun DNS.</td></tr>'}
    </tbody></table></div>
  <div class="card">
    <h2 style="font-size:18px">Ajouter un DNS</h2>
    <div class="row">
      <label class="f grow">Adresse (avec http:// et le port si besoin)<input type="url" id="newDns" placeholder="http://adresse:port"></label>
      <label class="f" style="width:160px">Rôle<select id="newRole"><option value="backup">Secours</option><option value="primary">Principal</option></select></label>
      <button class="btn primary" id="addDns">Ajouter</button>
    </div>
    <div class="row">
      <label class="f grow">Ligne de test : nom d'utilisateur<input type="text" id="tUser" autocomplete="off"></label>
      <label class="f grow">Ligne de test : mot de passe<input type="password" id="tPass" autocomplete="off"></label>
    </div>
    <p class="hint">La ligne de test sert au bouton « Tester » et à la synchronisation des catégories. Elle reste dans ce navigateur, elle n'est pas enregistrée dans Supabase.</p>
  </div>
  <div class="card" id="uaCard">
    <h2 style="font-size:18px">Identité de l'application (User-Agent)</h2>
    <div class="row">
      <label class="f grow">User-Agent envoyé au serveur IPTV<input type="text" data-k="user_agent" value="${esc(CONFIG.user_agent || 'IPTVSmartersPro')}"></label>
      <button class="btn primary" id="saveUa">Enregistrer</button>
    </div>
    <p class="hint">Si le panel de votre fournisseur permet de limiter une ligne à un User-Agent (« Allowed User Agents »), mettez ici un nom unique (ex. ZProPlayer) et le même nom dans le panel : la ligne ne marchera plus que dans Z Pro. Changez-le d'abord ici, attendez que les clients ouvrent l'app, puis limitez dans le panel.</p>
  </div>`;
  $('#saveUa').onclick = () => saveConfig(readFields($('#uaCard')));
  $('#tUser').value = localStorage.getItem('zpro_test_user') || '';
  $('#tPass').value = localStorage.getItem('zpro_test_pass') || '';
  $('#tUser').onchange = e => localStorage.setItem('zpro_test_user', e.target.value.trim());
  $('#tPass').onchange = e => localStorage.setItem('zpro_test_pass', e.target.value.trim());

  m.querySelectorAll('tr[data-id]').forEach(tr => {
    const id = tr.dataset.id;
    tr.querySelectorAll('[data-f]').forEach(el => el.onchange = async () => {
      const f = el.dataset.f; const v = el.type === 'checkbox' ? el.checked : el.value.trim();
      if (f === 'role' && v === 'primary') await q(sb.from('dns_servers').update({ role: 'backup' }).neq('id', id));
      await q(sb.from('dns_servers').update({ [f]: v }).eq('id', id), 'DNS');
      toast('DNS enregistré'); if (f === 'role') go('dns');
    });
    tr.querySelector('[data-a=del]').onclick = async () => {
      if (!confirm('Supprimer ce DNS ?')) return;
      await q(sb.from('dns_servers').delete().eq('id', id)); toast('DNS supprimé'); go('dns');
    };
    tr.querySelector('[data-a=test]').onclick = async () => testDns(tr.querySelector('[data-f=url]').value.trim());
  });
  $('#addDns').onclick = async () => {
    const url = $('#newDns').value.trim().replace(/\/+$/, '');
    if (!/^https?:\/\//.test(url)) return toast("L'adresse doit commencer par http:// ou https://", 'err');
    const role = $('#newRole').value;
    if (role === 'primary') await q(sb.from('dns_servers').update({ role: 'backup' }).gt('id', 0));
    await q(sb.from('dns_servers').insert({ url, role, position: rows.length + 1 }), 'Ajout du DNS');
    toast('DNS ajouté'); go('dns');
  };
};
function testLine() {
  const u = localStorage.getItem('zpro_test_user'), p = localStorage.getItem('zpro_test_pass');
  if (!u || !p) { toast('Remplissez d\'abord la ligne de test (rubrique Serveur & DNS).', 'err'); return null; }
  return { u, p };
}
async function xtream(base, action) {
  const t = testLine(); if (!t) throw new Error('Ligne de test manquante');
  // Passe par le serveur Supabase : une page https ne peut pas appeler un serveur IPTV en http.
  const [xaction, ...rest] = String(action || '').split('&');
  const extra = Object.fromEntries(rest.map(p => p.split('=')).map(([k, v]) => [k, decodeURIComponent(v || '')]));
  const r = await cmsCall({ action: 'xtream', base: base.replace(/\/+$/, ''), username: t.u, password: t.p, xaction: xaction || '', category_id: extra.category_id || '' });
  return r.data;
}
async function testDns(base) {
  try {
    const j = await xtream(base, '');
    if (j?.user_info?.auth == 1) toast(`OK : compte ${j.user_info.status}, ${j.user_info.max_connections} connexion(s)`);
    else toast('Le serveur répond, mais la ligne de test est refusée.', 'err');
  } catch (e) { if (e.message !== 'Ligne de test manquante') fail(e, 'Test'); }
}
async function primaryDns() {
  const rows = await q(sb.from('dns_servers').select('url,role,active').eq('active', true).order('position'));

}

async function showChannels(cat) {
  const base = await primaryDns();
  if (!base) return toast('Aucun DNS actif. Ajoutez-en un dans « Serveur & DNS ».', 'err');
  if (!testLine()) return;
  const box = document.createElement('div');
  box.style.cssText = 'position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;padding:16px';
  box.innerHTML = `<div class="card" style="width:min(640px,100%);max-height:88vh;display:flex;flex-direction:column;gap:12px">
    <div class="row" style="align-items:center"><h2 style="font-size:18px;margin:0">Chaînes : ${esc(cat.display_name || cat.raw_name)}</h2>
    <button class="btn sm ghost" data-x style="margin-left:auto">Fermer</button></div>
    <p class="hint" style="margin:0">Cochez « Masquer » : la chaîne disparaît de l'application pour tous les clients.</p>
    <input type="search" data-q placeholder="Rechercher une chaîne" aria-label="Rechercher une chaîne">
    <div data-list style="overflow:auto;display:flex;flex-direction:column;gap:6px"><p class="hint">Chargement…</p></div></div>`;
  document.body.appendChild(box);
  const close = () => box.remove();
  box.querySelector('[data-x]').onclick = close;
  box.onclick = e => { if (e.target === box) close(); };
  try {
    const [list, hidden] = await Promise.all([
      xtream(base, 'get_live_streams&category_id=' + encodeURIComponent(cat.xtream_category_id)),
      q(sb.from('hidden_channels').select('stream_id'))
    ]);
    const off = new Set(hidden.map(h => String(h.stream_id)));
    const chans = Array.isArray(list) ? list : [];
    box.querySelector('[data-list]').innerHTML = chans.map(c => `
      <label class="c" data-n="${esc(String(c.name || '').toLowerCase())}" style="display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;background:rgba(255,255,255,.04)">
        <input type="checkbox" data-id="${esc(c.stream_id)}" data-name="${esc(c.name || '')}" ${off.has(String(c.stream_id)) ? 'checked' : ''}>
        <span style="flex:1">${esc(c.name || '')}</span><span class="hint">Masquer</span></label>`).join('') || '<p class="hint">Aucune chaîne.</p>';
    box.querySelector('[data-q]').oninput = e => {
      const v = e.target.value.toLowerCase();
      box.querySelectorAll('[data-n]').forEach(l => l.classList.toggle('hidden', !l.dataset.n.includes(v)));
    };
    box.querySelectorAll('input[data-id]').forEach(cb => cb.onchange = async () => {
      const id = cb.dataset.id;
      if (cb.checked) await q(sb.from('hidden_channels').upsert({ stream_id: id, name: cb.dataset.name, category_id: String(cat.xtream_category_id) }), 'Masquer');
      else await q(sb.from('hidden_channels').delete().eq('stream_id', id), 'Afficher');
      toast(cb.checked ? 'Chaîne masquée' : 'Chaîne affichée');
    });
  } catch (e) { box.querySelector('[data-list]').innerHTML = `<p class="hint" style="color:#FFB3B7">${esc(e.message)}</p>`; }
}
async function syncCats() {
  const base = await primaryDns();
  if (!base) return toast('Aucun DNS actif. Ajoutez-en un dans « Serveur & DNS ».', 'err');
  if (!testLine()) return;
  const b = $('#sync'); b.disabled = true; b.textContent = 'Synchronisation…';
  try {
    const list = await xtream(base, KIND_ACTION[CAT_KIND]);
    if (!Array.isArray(list)) throw new Error('Réponse inattendue du serveur');
    const existing = await q(sb.from('categories').select('xtream_category_id').eq('kind', CAT_KIND));
    const have = new Set(existing.map(e => String(e.xtream_category_id)));
    const start = existing.length;
    const fresh = list.filter(c => !have.has(String(c.category_id)))
      .map((c, i) => ({ kind: CAT_KIND, xtream_category_id: String(c.category_id), raw_name: c.category_name, position: start + i + 1 }));
    if (fresh.length) await q(sb.from('categories').insert(fresh), 'Ajout des catégories');
    // met à jour le nom du panel des catégories déjà connues
    await Promise.all(list.filter(c => have.has(String(c.category_id))).map(c =>
      sb.from('categories').update({ raw_name: c.category_name }).eq('kind', CAT_KIND).eq('xtream_category_id', String(c.category_id))));
    toast(`${list.length} catégories lues, ${fresh.length} nouvelle(s)`);
    go('cats');
  } catch (e) { fail(e, 'Synchronisation'); b.disabled = false; b.textContent = 'Synchroniser la liste'; }
}

/* ================= Abonnements (création de lignes + codes d'activation) ================= */
const FN = 'bright-responder';
async function cmsCall(body) {
  const { data, error } = await sb.functions.invoke(FN, { body });
  if (error) {
    let m = error.message;
    try { const j = await error.context.json(); m = j.error || m; if (j.username) m += ` (la ligne ${j.username} a été créée sur le panel : prévenez le propriétaire)`; } catch {}
    throw new Error(m);
  }
  if (data && data.error) throw new Error(data.error);
  return data;
}

  <div class="card">

      const pw = window.prompt(`Nouveau mot de passe pour ${v.name} (6 caractères min.)`);
      if (!pw) return;
      try { await cmsCall({ action: 'vendor_password', vendor_id: vid, password: pw }); toast('Mot de passe changé'); } catch (e) { toast(e.message, 'err'); }
    };
  });
};

/* ================= Appareils (1 ligne = 1 appareil) ================= */
let DEV_SEARCH = '';
RENDER.devices = async (m) => {
  const rows = await q(sb.from('device_locks').select('*').order('last_seen', { ascending: false }).limit(1000));
  const on = CONFIG.device_lock_enabled !== false;
  m.innerHTML = head('Appareils', 'Chaque ligne ne fonctionne que sur le premier appareil où elle se connecte. « Réinitialiser » libère la ligne pour un autre appareil.') + `
  <div class="card" id="lockCard" style="max-width:820px">
    <label class="c"><input type="checkbox" data-k="device_lock_enabled" ${on ? 'checked' : ''}> Activer « 1 ligne = 1 appareil »</label>
    <button class="btn primary" id="saveLock" style="align-self:flex-start">Enregistrer</button>
  </div>
  <div class="row"><label class="f" style="width:320px"><span class="hint">Rechercher un nom d'utilisateur</span><input type="search" id="devSearch" value="${esc(DEV_SEARCH)}"></label>
  <span class="hint" style="margin-left:auto">${rows.length} ligne(s) liée(s)</span></div>
  <div class="tbl"><table style="min-width:820px">
    <thead><tr><th>Nom d'utilisateur</th><th>Code appareil</th><th>Type</th><th>Première connexion</th><th>Dernière connexion</th><th></th></tr></thead>
    <tbody>${rows.map(r => `
      <tr data-u="${esc(r.username)}" data-name="${esc(r.username).toLowerCase()}">
        <td><strong>${esc(r.username)}</strong></td>
        <td><span class="pill grey">${esc(String(r.device_id).slice(0, 8).toUpperCase())}</span></td>
        <td class="hint">${esc(r.device_name)}</td>
        <td class="hint">${new Date(r.first_seen).toLocaleString('fr-FR')}</td>
        <td class="hint">${new Date(r.last_seen).toLocaleString('fr-FR')}</td>
        <td><button class="btn sm danger" data-a="reset">Réinitialiser</button></td>
      </tr>`).join('') || '<tr><td colspan="6" class="hint">Aucune ligne liée pour le moment.</td></tr>'}
    </tbody></table></div>
  <p class="hint">Le « Code appareil » est aussi affiché dans l'app (Paramètres), et dans le message d'erreur quand un client essaie sur un autre appareil.</p>`;
  $('#saveLock').onclick = () => saveConfig(readFields($('#lockCard')));
  const filter = () => m.querySelectorAll('tr[data-u]').forEach(tr => tr.classList.toggle('hidden', !tr.dataset.name.includes(DEV_SEARCH.toLowerCase())));
  $('#devSearch').oninput = e => { DEV_SEARCH = e.target.value.trim(); filter(); };
  filter();
  m.querySelectorAll('[data-a=reset]').forEach(b => b.onclick = async () => {
    const u = b.closest('tr').dataset.u;
    if (!confirm(`Réinitialiser la ligne « ${u} » ? Elle pourra être activée sur un autre appareil.`)) return;
    await q(sb.from('device_locks').delete().eq('username', u), 'Réinitialisation');
    toast(`Ligne ${u} réinitialisée`); go('devices');
  });
};

/* ================= Mises à jour ================= */
RENDER.updates = async (m) => {
  const c = CONFIG;
  m.innerHTML = head('Mises à jour de l\'app', 'Quand la version en ligne est plus récente que celle du client, l\'app propose la mise à jour.') + `
  <div class="card" id="upd" style="max-width:820px">
    <label class="f">Version en ligne (ex. 1.0.1)<input type="text" data-k="latest_version" value="${esc(c.latest_version)}" style="width:160px"></label>
    <label class="f">Lien de téléchargement de l'APK<input type="url" data-k="apk_url" value="${esc(c.apk_url)}" placeholder="https://…"></label>
    <div class="row"><button class="btn" id="upApk">Déposer un nouvel APK</button><span class="hint" id="apkInfo"></span></div>
    <label class="c"><input type="checkbox" data-k="force_update" ${c.force_update ? 'checked' : ''}> Mise à jour obligatoire (le client ne peut pas continuer sans mettre à jour)</label>
    <button class="btn primary" id="saveUpd" style="align-self:flex-start">Enregistrer</button>
    <p class="hint">Pensez à augmenter le numéro de version à chaque nouvel APK. Taille maximale d'un fichier sur l'offre gratuite Supabase : 50 Mo.</p>
  </div>`;
  $('#upApk').onclick = async () => {
    const f = await pickFile('.apk,application/vnd.android.package-archive'); if (!f) return;
    $('#upApk').disabled = true; $('#apkInfo').textContent = `Envoi de ${f.name} (${(f.size / 1048576).toFixed(1)} Mo)…`;
    try { const url = await uploadFile(f, 'apk'); m.querySelector('[data-k=apk_url]').value = url; $('#apkInfo').textContent = 'APK envoyé. Cliquez sur « Enregistrer ».'; }
    catch { $('#apkInfo').textContent = 'Échec de l\'envoi.'; }
    finally { $('#upApk').disabled = false; }
  };
  $('#saveUpd').onclick = () => {
    const o = readFields($('#upd'));
    if (!/^\d+\.\d+\.\d+$/.test(o.latest_version || '')) return toast('Version au format 1.0.0', 'err');
    saveConfig(o);
  };
};

/* ================= Maintenance ================= */
RENDER.maintenance = async (m) => {
  const c = CONFIG;
  m.innerHTML = head('Maintenance', 'Affiche un écran de maintenance à tous les clients.') + `
  <div class="card" id="mnt" style="max-width:820px">
    <label class="c"><input type="checkbox" data-k="maintenance_enabled" ${c.maintenance_enabled ? 'checked' : ''}> Activer l'écran de maintenance</label>
    <label class="f">Message affiché<input type="text" data-k="maintenance_message" value="${esc(c.maintenance_message)}"></label>
    <button class="btn primary" id="saveMnt" style="align-self:flex-start">Enregistrer</button>
  </div>`;
  $('#saveMnt').onclick = () => {
    const o = readFields($('#mnt'));
    if (o.maintenance_enabled && !confirm('Activer la maintenance ? Les clients ne pourront plus regarder.')) return;
    saveConfig(o);
  };
};

window.addEventListener('hashchange', () => { const id = location.hash.slice(1); if (ROLE && RENDER[id] && (CONFIG || ROLE !== 'owner')) go(id); });
boot();
</script>
</body>
</html>
